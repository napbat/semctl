[workspace]

[workspace.lints.rust]
warnings = { level = "deny", priority = -2 }
unused = { level = "deny", priority = -1 }
nonstandard_style = { level = "deny", priority = -1 }
rust_2018_idioms = { level = "deny", priority = -1 }
future_incompatible = { level = "deny", priority = -1 }

[workspace.lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
style = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }

[workspace.lints.rustdoc]
all = { level = "warn", priority = -1 }

[package]
name = "semctl"
version = "0.1.19"
edition = "2024"
publish = false
description = "semctl — command-line client for the semctx code-intelligence server. Speaks HTTP+JSON; authenticates to identity via OIDC device-code."
license = "MIT OR Apache-2.0"
repository = "https://github.com/napbat/semctl"
readme = "README.md"

[[bin]]
name = "semctl"
path = "src/main.rs"

[features]
hook-debug = []

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "signal",
    "time",
    "sync",
    "process",
] }
dirs = "5"
open = "5"
toml = "0.8"
inquire = "0.7"
self-replace = "1"
sha2 = "0.10"
flate2 = "1"
tar = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
rmcp = { version = "1.7", features = [
    "server",
    "transport-io",
    "macros",
    "schemars",
] }
schemars = "1"
ignore = "0.4"
notify = "8"
notify-debouncer-full = "0.7"
glob = "0.3"
blake3 = "1"
cap-std = "4"
same-file = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(windows)'.dependencies]
tempfile = "3"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
