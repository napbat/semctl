name: ci

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v4
        with:
          install_args: bun
      # Deliberately floating. A new stable can turn a fresh lint into a build
      # failure on a morning nobody touched the code — the trade is that those
      # arrive one at a time and get fixed, instead of accumulating behind a pin
      # until somebody raises it and meets all of them at once.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --check
      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: docs
        run: cargo doc --workspace --no-deps --document-private-items --locked
        env:
          RUSTDOCFLAGS: "-D warnings"
      - name: test
        run: cargo test --workspace --locked
      - name: OMP extension test
        run: mise exec -c "bun test plugins/semctx/adapters/omp/index.test.ts"
