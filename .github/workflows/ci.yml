name: ci

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # CI never attaches a debugger. Line tables keep file:line in panic
  # backtraces and cut test compile time by about a fifth and `target/` (the
  # cached directory) by about a third. Local builds keep full debug info.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      # Report every platform. One platform failure must not hide another.
      fail-fast: false
      matrix:
        # The release builds binaries for these three platforms. Each one runs
        # its own `cfg` code paths and its own file-watcher backend.
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: jdx/mise-action@v4
        if: runner.os == 'Linux'
        with:
          install_args: bun
      # Deliberately floating. A new stable can turn a fresh lint into a build
      # failure on a morning nobody touched the code — the trade is that those
      # arrive one at a time and get fixed, instead of accumulating behind a pin
      # until somebody raises it and meets all of them at once.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      # Formatting does not depend on the platform.
      - name: fmt
        if: runner.os == 'Linux'
        run: cargo fmt --check
      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: docs
        run: cargo doc --workspace --no-deps --document-private-items --locked
        env:
          RUSTDOCFLAGS: "-D warnings"
      - name: test
        run: cargo test --workspace --locked
      # The remaining checks do not depend on the platform, except the
      # PowerShell installer, which also runs on the platform it targets.
      - name: OMP extension test
        if: runner.os == 'Linux'
        run: mise exec -c "bun test plugins/semctx/adapters/omp/index.test.ts"
      - name: Bootstrap installer test
        if: runner.os == 'Linux'
        run: python3 tests/bootstrap_installers.py
      - name: Bootstrap installer test (PowerShell)
        if: runner.os == 'Windows'
        run: python tests/bootstrap_installers.py --shell pwsh
      - name: Release source test
        if: runner.os == 'Linux'
        run: python3 tests/release_source.py
      - name: Diff whitespace check
        if: runner.os == 'Linux'
        run: git diff --check
