default_stages = ["pre-commit"]

[[repos]]
repo = "local"
hooks = [
  {
    id = "cargo-fmt",
    name = "cargo fmt --check",
    language = "system",
    entry = "cargo fmt --check",
    pass_filenames = false,
    always_run = true,
  },
  {
    id = "cargo-clippy",
    name = "cargo clippy --workspace --all-targets --locked -- -D warnings",
    language = "system",
    entry = "cargo clippy --workspace --all-targets --locked -- -D warnings",
    pass_filenames = false,
    always_run = true,
  },
  {
    id = "cargo-doc",
    name = "cargo doc --workspace --no-deps --document-private-items --locked",
    language = "system",
    entry = "cargo doc --workspace --no-deps --document-private-items --locked",
    env = { RUSTDOCFLAGS = "-D warnings" },
    pass_filenames = false,
    always_run = true,
  },
  {
    id = "cargo-test",
    name = "cargo test --workspace --locked",
    language = "system",
    entry = "cargo test --workspace --locked",
    pass_filenames = false,
    always_run = true,
  },
  {
    id = "omp-extension-test",
    name = "mise exec Bun test for OMP extension",
    language = "system",
    entry = "mise exec -c \"bun test plugins/semctx/adapters/omp/index.test.ts\"",
    pass_filenames = false,
    always_run = true,
  },
]
