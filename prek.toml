default_stages = ["pre-commit"]

[[repos]]
repo = "local"

[[repos.hooks]]
id = "cargo-fmt"
name = "cargo fmt --check"
language = "system"
entry = "cargo fmt --check"
pass_filenames = false
always_run = true

[[repos.hooks]]
id = "cargo-clippy"
name = "cargo clippy --workspace --all-targets --locked -- -D warnings"
language = "system"
entry = "cargo clippy --workspace --all-targets --locked -- -D warnings"
pass_filenames = false
always_run = true

[[repos.hooks]]
id = "cargo-doc"
name = "cargo doc --workspace --no-deps --document-private-items --locked"
language = "system"
entry = "cargo doc --workspace --no-deps --document-private-items --locked"
env = { RUSTDOCFLAGS = "-D warnings" }
pass_filenames = false
always_run = true

[[repos.hooks]]
id = "cargo-test"
name = "cargo test --workspace --locked"
language = "system"
entry = "cargo test --workspace --locked"
pass_filenames = false
always_run = true

[[repos.hooks]]
id = "omp-extension-check"
name = "type-check OMP extension"
language = "system"
entry = "bun run --cwd plugins/semctx/adapters/omp check"
pass_filenames = false
always_run = true

[[repos.hooks]]
id = "omp-extension-test"
name = "test OMP extension"
language = "system"
entry = "bun run --cwd plugins/semctx/adapters/omp test"
pass_filenames = false
always_run = true
